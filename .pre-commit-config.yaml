repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.11
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix]

  - repo: local
    hooks:
      - id: ty-check
        name: ty check
        entry: uv run ty check .
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: biome-check
        name: biome check
        entry: pnpm --dir ui lint
        language: system
        pass_filenames: false
        files: ^ui/
      - id: frontend-typecheck
        name: frontend typecheck
        entry: pnpm --dir ui typecheck
        language: system
        pass_filenames: false
        files: ^ui/
      - id: secret-pattern-scan
        name: secret pattern scan
        entry: scripts/secret_scan.sh
        language: script
        pass_filenames: false
