[project]
name = "kombu"
version = "0.1.0"
description = "A modern, self-hostable kitchen operating system for recipes, inventory, shopping, scanners, and smart cooking workflows."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Kombu Contributors" }]
dependencies = [
    "alembic>=1.17,<2.0",
    "fastapi[standard]>=0.116,<1.0",
    "httpx>=0.28,<0.29",
    "kagglehub>=0.3.0",
    "litellm>=1.91.1",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.10,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0,<5.0",
    "pytest>=8.0,<9.0",
    "ruff>=0.12,<1.0",
    "ty>=0.0.1a14",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["api", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["api/tests"]
pythonpath = ["."]

[tool.ty.environment]
python-version = "3.12"
python = ".venv"
