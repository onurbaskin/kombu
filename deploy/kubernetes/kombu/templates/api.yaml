apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kombu.fullname" . }}-api
  labels:
    {{- include "kombu.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "kombu.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "kombu.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "kombu.serviceAccountName" . }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          command: ["uv", "run", "--no-dev", "uvicorn", "api.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "kombu.fullname" . }}-config
            - secretRef:
                name: {{ include "kombu.secretName" . }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: var
              mountPath: /app/var
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: var
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-var" (include "kombu.fullname" .)) .Values.persistence.existingClaim }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kombu.fullname" . }}-api
  labels:
    {{- include "kombu.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "kombu.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
