{{- if not .Values.secrets.existingSecret }}
{{- if not .Values.database.url }}
{{- fail "database.url is required when secrets.existingSecret is empty" }}
{{- end }}
{{- if and (eq .Values.blobStorage.backend "s3") (not .Values.blobStorage.endpointUrl) }}
{{- fail "blobStorage.endpointUrl is required when blobStorage.backend=s3" }}
{{- end }}
{{- if and (gt (int .Values.worker.replicas) 1) (not .Values.cache.url) }}
{{- fail "cache.url is required when worker.replicas is greater than one" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kombu.secretName" . }}
  labels:
    {{- include "kombu.labels" . | nindent 4 }}
type: Opaque
stringData:
  KOMBU_DATABASE_URL: {{ .Values.database.url | quote }}
  KOMBU_ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | quote }}
  KOMBU_CACHE_URL: {{ .Values.cache.url | quote }}
  KOMBU_S3_ENDPOINT_URL: {{ .Values.blobStorage.endpointUrl | quote }}
  KOMBU_S3_BUCKET: {{ .Values.blobStorage.bucket | quote }}
  KOMBU_S3_ACCESS_KEY: {{ .Values.blobStorage.accessKey | quote }}
  KOMBU_S3_SECRET_KEY: {{ .Values.blobStorage.secretKey | quote }}
{{- end }}
