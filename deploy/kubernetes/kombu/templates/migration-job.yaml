apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kombu.fullname" . }}-migrate
  labels:
    {{- include "kombu.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "kombu.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "kombu.serviceAccountName" . }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          command: ["uv", "run", "--no-dev", "alembic", "-c", "api/alembic.ini", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: {{ include "kombu.fullname" . }}-config
            - secretRef:
                name: {{ include "kombu.secretName" . }}
